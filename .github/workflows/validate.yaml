
name: Validate

on:
  # Post-merge validation only. Feature branches are validated by their
  # pull_request run, so a branch push with an open PR no longer triggers
  # a duplicate (previously cancelled) push run.
  push:
    branches:
      - master
  # All pull requests.
  pull_request:
    branches:
      - '**'

# Least-privilege token; the validate workflow only needs to read the repo.
permissions:
  contents: read

# A push and its pull_request both trigger this workflow on the same
# branch. Group them so only one full matrix runs, and cancel runs that
# are superseded by a newer commit on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test ./...
      - run: go build -o cmd/desync/ ./cmd/desync

      # Fast signal for the FreeBSD build. The freebsd job below runs the
      # actual tests, but it has to boot a VM first, so a broken build is
      # reported here within seconds instead of minutes.
      - name: Cross-compile FreeBSD
        if: runner.os == 'Linux'
        run: GOOS=freebsd GOARCH=amd64 go build -o /dev/null ./cmd/desync

      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Static analysis
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "Files need gofmt:"; gofmt -l .; exit 1; }
          go mod tidy -diff

  # FreeBSD has no GitHub-hosted runner, so the tests run in a VM on the Linux
  # runner. Booting it costs a few minutes, hence the separate job.
  freebsd:
    name: Validate on FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y go
          run: |
            go test ./...
            go build -o cmd/desync/ ./cmd/desync
