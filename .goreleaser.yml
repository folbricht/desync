version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # Man pages are a build artifact rather than source, so they're generated
    # here instead of being committed. The manpage command has existed for a
    # while but releases only ever shipped the binary (#225).
    - go run ./cmd/desync manpage man

builds:
  - main: ./cmd/desync
    ldflags:
      - -s -w
      - -X main.version={{.Tag}}
      - -X main.commit={{.FullCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      # The remaining BSDs build and pass their test suites, but can't FUSE
      # mount: go-fuse supports linux, darwin and freebsd only. Every other
      # command works.
      - netbsd
      - openbsd
      - dragonfly
    goarch:
      - amd64
      - arm64
      # 32-bit ARM and RISC-V for the embedded/appliance case, which is where
      # image updates tend to land. Linux only: the other platforms either
      # don't support these architectures at all, or (the BSDs) are too niche
      # to be worth an artifact nobody exercises.
      - arm
      - riscv64
    # Both ARM variants: v6 runs anywhere 32-bit ARM does, v7 is faster on
    # hardware that supports it, which matters for chunking throughput.
    goarm:
      - "6"
      - "7"
    # Combinations Go has no port for at all (dragonfly is amd64-only, for
    # instance) are dropped by goreleaser on its own; these are the ones that
    # would otherwise build and ship.
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: netbsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: openbsd
        goarch: riscv64

archives:
  # Declaring files at all replaces goreleaser's default list, so the license
  # and readme have to be named again alongside the man pages.
  - files:
      - LICENSE*
      - README*
      - src: man/*
        dst: man

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
